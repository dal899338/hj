<!DOCTYPE hTML>
<HTML lang='en'>

    <head>
        <meta charset= 'Utf-8'>
        <meta name="viewport" content='width-device-width, initial-scale=1.0'>
        <title>Form Demo</title>
        <link rel="stylesheet" href="./assets/css/style.css">

    </head>
    <body>
        <main class="container">
            <h1>Simple Javascript form</h1>
            <p>Enter two numbers and Javascript will add them for you</p>
            <form id="myForm">
                <label for="q1">First number</label>
                <input type="number" id="q1" name="q1 required">
                <label for="q2">Second number</label>
                <input type="number" id="q2" name="q2 required">
                 
                <button type="submit">Calculate</button>

                <label for="answer">Answer</label>
                <input type="number" id="answer" name="answer" readonly>
            
        </form>
        </main>
        <script src="./assets/js/script.js"></script>

    </body>
